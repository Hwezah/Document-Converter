<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Convert, open, edit and write documents and notes." />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preload" href="./fonts/GoogleSansFlex.woff2" as="font" type="font/woff2" crossorigin />
    <title>Folio</title>
    <script>
      // Theme before first paint, so a light-mode page never flashes black.
      try {
        const t = localStorage.getItem("folio.theme") || "system";
        const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
